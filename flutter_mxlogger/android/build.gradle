group 'com.coderdjy.mxlogger'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
        mavenLocal()

    }

    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.0'

    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
        // 本地开发: 直接引用本仓库 Android 库构建产物(先执行 :mxlogger:assembleDefaultCppRelease)
        flatDir {
            dirs "/Users/dongjiayi/Documents/github/MXLogger/Android/MXLogger/mxlogger/build/outputs/aar"
        }
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 33
    if (project.android.hasProperty("namespace")) {
        namespace 'com.coderdjy.mxlogger'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
    }
    dependencies {

        // 本地开发走本地 AAR；发布 pub 包时换回 maven 坐标:
        // implementation 'io.github.coder-dongjiayi:mxlogger:2.0.0'
        implementation(name: "mxlogger-DefaultCpp-release", ext: "aar")

    }
}

