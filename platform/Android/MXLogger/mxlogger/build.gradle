plugins {
    id 'com.android.library'
    id 'jacoco'
}

jacoco { toolVersion = '0.8.12' }

android {
    namespace  "com.dongjiayi.mxlogger"
    defaultPublishConfig "DefaultCppRelease"

    compileSdk 31
    ndkVersion "27.0.12077973"

    testOptions {
        unitTests.returnDefaultValues = System.getenv('MXLOGGER_JNI_TEST_LIBRARY_DIR') != null
        unitTests.all {
            def hostJni = System.getenv('MXLOGGER_JNI_TEST_LIBRARY_DIR')
            if (hostJni) systemProperty 'java.library.path', hostJni
        }
    }
    sourceSets {
        test.java.srcDir 'src/sharedTest/java'
        androidTest.java.srcDir 'src/sharedTest/java'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    defaultConfig {
        minSdk 21
        targetSdk 31
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "proguard-rules.pro"
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    flavorDimensions "stl_mode"

    productFlavors {
        DefaultCpp {
            dimension "stl_mode"
            ext.artifactIdSuffix = ''
            externalNativeBuild {
                cmake {
                    arguments = ["-DANDROID_STL=c++_static"]
                    cppFlags "-DMMKV_STL_SHARED=0"
                }
            }
        }

    }
}

tasks.register('apiCoverageReport', JacocoReport) {
    dependsOn 'testDefaultCppReleaseUnitTest'
    executionData fileTree(buildDir).include('jacoco/testDefaultCppReleaseUnitTest.exec')
    classDirectories.setFrom(fileTree("$buildDir/intermediates/javac/DefaultCppRelease/compileDefaultCppReleaseJavaWithJavac/classes") {
        include 'com/dongjiayi/mxlogger/MXLogger.class'
    })
    sourceDirectories.setFrom(files('src/main/java'))
    reports {
        xml.required = true
        html.required = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test:runner:1.4.0'
}
