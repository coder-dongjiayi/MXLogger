//}
// ===== Javadoc 产物：Maven Central 要求正式版必须带 -javadoc.jar =====
tasks.register('javadocRelease', Javadoc) {
    source = android.sourceSets.main.java.srcDirs
    // android.jar + 该 variant 的编译依赖（androidx.annotation 等），否则 import 解析不了
    classpath = files(android.getBootClasspath())
    classpath += configurations.getByName('DefaultCppReleaseCompileClasspath')
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

tasks.register('javadocJar', Jar) {
    dependsOn 'javadocRelease'
    archiveClassifier.set('javadoc')
    from tasks.named('javadocRelease').map { it.destinationDir }
}
