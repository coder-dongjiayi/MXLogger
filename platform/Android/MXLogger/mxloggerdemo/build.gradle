plugins {
    id 'com.android.application'
}

android {
    namespace "com.dongjiayi.mxloggerdemo"
    compileSdk 33

    defaultConfig {
        applicationId "com.dongjiayi.mxloggerdemo"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Installable CI demo; the build remains Release/non-debuggable.
            // This opt-in uses a test key, separate from any production signing.
            if (providers.gradleProperty('mxloggerDemoTestSigning').orNull == 'true') {
                signingConfig signingConfigs.debug
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
    flavorDimensions "stl_mode"
    productFlavors {
        DefaultCpp.dimension = "stl_mode"
    }
}

dependencies {

    implementation project(':mxlogger')
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.navigation:navigation-fragment:2.4.1'
    implementation 'androidx.navigation:navigation-ui:2.4.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
