group 'com.coderdjy.mxlogger'
version '2.3.0'

buildscript {
    repositories {
        google()
        mavenCentral()
        mavenLocal()

    }

    dependencies {
        classpath "com.android.tools.build:gradle:${System.getenv('MXLOGGER_LOCAL_NATIVE') == '1' ? '8.7.3' : '4.1.0'}"

    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 33
    if (project.android.hasProperty("namespace")) {
        namespace 'com.coderdjy.mxlogger'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
        missingDimensionStrategy 'stl_mode', 'DefaultCpp'
    }
    dependencies {

        if (System.getenv('MXLOGGER_LOCAL_NATIVE') == '1') {
            if (rootProject.findProject(':mxlogger_local') == null) {
                throw new GradleException('Local Core required: include :mxlogger_local in the host settings.gradle')
            }
            implementation project(':mxlogger_local')
        } else {
            implementation 'io.github.coder-dongjiayi:mxlogger:2.3.0'
        }

    }
}

tasks.register('verifyLocalMXLoggerDependency') {
    doLast {
        if (System.getenv('MXLOGGER_LOCAL_NATIVE') != '1') {
            throw new GradleException('This check requires MXLOGGER_LOCAL_NATIVE=1')
        }
        def checkout = new File(System.getenv('MXLOGGER_LOCAL_NATIVE_ROOT')).canonicalFile
        def nativeProject = rootProject.project(':mxlogger_local')
        if (nativeProject.projectDir.canonicalFile != new File(checkout, 'platform/Android/MXLogger/mxlogger').canonicalFile) {
            throw new GradleException('Native Android project is not from this checkout')
        }
        def components = configurations.getByName('debugRuntimeClasspath').incoming.resolutionResult.allComponents
        if (!components.any { it.id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier && it.id.projectPath == ':mxlogger_local' }) {
            throw new GradleException('Local MXLogger project missing from resolved dependencies')
        }
        if (components.any { it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier && it.id.group == 'io.github.coder-dongjiayi' && it.id.module == 'mxlogger' }) {
            throw new GradleException('Remote MXLogger Maven dependency found in local CI build')
        }
        def report = new File(buildDir, 'reports/local-core.json')
        report.parentFile.mkdirs()
        report.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            project: nativeProject.projectDir.canonicalPath,
            core: new File(checkout, 'Core').canonicalPath,
            resolved: components.collect { it.id.displayName }
        ]))
        println "PASS: local Java/JNI/Core dependency; report: $report"
    }
}

