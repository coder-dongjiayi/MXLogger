name: verify-logger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Global stage barrier: every Core configuration must pass before ANY API job.
  core-tests:
    name: 1. Core unit tests (${{ matrix.os }}, ${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and test this checkout's C++ Core
        run: python scripts/verify_core_ci.py --configuration ${{ matrix.configuration }}
      - name: Check shared Flutter ABI headers
        run: python scripts/sync_flutter_native.py --check
      - name: Test precompiled DLL packaging rules
        run: python -m unittest discover -s scripts/tests -p 'test_flutter_windows_package.py' -v

  windows-api:
    name: 2. Windows API tests (${{ matrix.configuration }})
    needs: [core-tests]
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Native API actions and Win32 window tests (no package)
        shell: pwsh
        run: |
          & './scripts/verify_windows_demo.ps1' -Configuration ${{ matrix.configuration }}
          python scripts/check_local_core.py --cmake-cache build/windows-native-demo/${{ matrix.configuration }}/CMakeCache.txt --output build/windows-native-demo/${{ matrix.configuration }}/local-core.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  ios-api:
    name: 2. iOS API tests
    needs: [core-tests]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Native iOS XCTest and background cleanup
        run: bash scripts/verify_ios_api.sh
      - name: Native iOS Demo integration build (no package)
        run: |
          mkdir -p build/ios-demo-tests
          for configuration in Debug Release; do
            xcodebuild -quiet -project platform/iOS/MXLoggerDemo/MXLoggerDemo.xcodeproj -scheme MXLoggerDemo -configuration "$configuration" -destination 'generic/platform=iOS' -derivedDataPath "build/ios-demo-tests/$configuration" CODE_SIGNING_ALLOWED=NO build > "build/ios-demo-tests/$configuration.log" 2>&1 || { tail -n 80 "build/ios-demo-tests/$configuration.log"; exit 1; }
          done

  macos-api:
    name: 2. macOS API tests
    needs: [core-tests]
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Objective-C and Swift API tests from local sources
        run: |
          mkdir -p build/apple-api-tests
          bash platform/iOS/MXLogger/tests/run_tests.sh > build/apple-api-tests/tests.log 2>&1 || { tail -n 100 build/apple-api-tests/tests.log; exit 1; }
      - name: Installed C++ SDK API consumer, Debug and Release
        run: |
          bash scripts/verify_core_package.sh --skip-core-tests > build/apple-api-tests/installed-sdk.log 2>&1 || { tail -n 100 build/apple-api-tests/installed-sdk.log; exit 1; }
      - name: Native Demo actions and window tests (no package)
        run: |
          bash scripts/verify_macos_demo.sh
          python3 scripts/check_local_core.py --pod-lock platform/macOS/MXLoggerDemo/Podfile.lock --output build/macos-native-demo/local-core.json

  android-api:
    name: 2. Android API tests (JNI + device)
    needs: [core-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MXLOGGER_JNI_TEST_LIBRARY_DIR: ${{ github.workspace }}/build/android-api-host/jni
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;27.0.12077973 cmake;3.22.1 platforms;android-31 platforms;android-33 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Java API tests with real checkout JNI and Core
        run: |
          bash scripts/verify_android_api_host.sh --skip-core-tests
          python3 scripts/check_local_core.py --cmake-cache build/android-api-host/CMakeCache.txt --output build/android-api-host/local-core.json
          bash scripts/verify_android_demo.sh test
      - name: Android Core and bridges, four ABIs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          bash scripts/verify_android_native.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android instrumentation on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/verify_android_device.sh

  flutter-apple-api:
    name: 2. Flutter APIs (macOS + iOS, local Pods/SPM)
    needs: [core-tests]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - name: Dart tests, macOS Pods/SPM and iOS integration
        run: python3 scripts/verify_macos_support.py --skip-native --ios-integration

  flutter-android-api:
    name: 2. Flutter APIs (Android, local Java/JNI/Core)
    needs: [core-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;27.0.12077973 ndk;28.2.13676358 cmake;3.22.1 platforms;android-31 platforms;android-33 platforms;android-36 build-tools;34.0.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Flutter mobile API integration and resolved dependency checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 scripts/verify_flutter_android.py --device emulator-5554

  flutter-windows-api:
    name: 2. Flutter Windows FFI (${{ matrix.configuration }})
    needs: [core-tests]
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - name: Local NuGet restore, DLL exports, real Dart FFI and relocated Flutter runner
        shell: pwsh
        run: "& './scripts/verify_flutter_windows.ps1' -Configuration ${{ matrix.configuration }}"

  # Stage 3 starts only after ALL stage-2 API jobs (including matrices) pass.
  windows-sdk:
    name: 3. Windows SDK + Flutter Release Demo
    needs: [windows-api, ios-api, macos-api, android-api, flutter-apple-api, flutter-android-api, flutter-windows-api]
    # Build the distributable with VS 2022's toolset, rather than requiring the
    # newer compiler that windows-latest may carry.
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - name: Build, test, pack and restore native NuGet SDK
        run: |
          & './scripts/build_windows_nuget.ps1'
          python scripts/check_local_core.py --cmake-cache build/windows-sdk/core-MD/CMakeCache.txt --cmake-cache build/windows-sdk/core-MT/CMakeCache.txt --cmake-cache build/windows-sdk/ffi/CMakeCache.txt --output build/windows-sdk/logs/local-core.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test final NuGet DLLs and build the interactive Flutter Release Demo
        run: |
          & './scripts/verify_flutter_windows.ps1' -Configuration Debug -PackagePath build/windows-sdk/packages/MXLogger.Native.2.3.0.nupkg -SkipExample
          & './scripts/verify_flutter_windows.ps1' -Configuration Release -PackagePath build/windows-sdk/packages/MXLogger.Native.2.3.0.nupkg -DemoOutputDirectory build/flutter-windows-release/MXLoggerFlutterDemo-windows-x64-Release
          python scripts/prepare_flutter_windows.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify vcpkg consumers (MD and MT, Debug and Release)
        run: "& './scripts/verify_windows_vcpkg.ps1'"
      - name: Upload local vcpkg SDK source and overlay
        uses: actions/upload-artifact@v7
        with:
          name: MXLogger-vcpkg-local-sdk
          path: |
            Core/
            platform/Windows/vcpkg/
            platform/Windows/README*.md
            LICENSE.TXT
          retention-days: 7
          if-no-files-found: error
      - name: Upload native NuGet package directly
        uses: actions/upload-artifact@v7
        with:
          path: build/windows-sdk/packages/MXLogger.Native.*.nupkg
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload Flutter Windows Release Demo (complete runtime bundle)
        uses: actions/upload-artifact@v7
        with:
          name: MXLoggerFlutterDemo-windows-x64-Release
          path: build/flutter-windows-release/MXLoggerFlutterDemo-windows-x64-Release/
          retention-days: 7
          if-no-files-found: error
      - name: Upload prepared Flutter package with precompiled Windows DLLs
        uses: actions/upload-artifact@v7
        with:
          name: flutter_mxlogger-windows-prebuilt
          path: |
            platform/flutter_mxlogger/
            !platform/flutter_mxlogger/**/build/**
            !platform/flutter_mxlogger/**/.dart_tool/**
            !platform/flutter_mxlogger/**/.flutter-plugins*
            !platform/flutter_mxlogger/**/ephemeral/**
            !platform/flutter_mxlogger/**/Pods/**
            !platform/flutter_mxlogger/**/.symlinks/**
            !platform/flutter_mxlogger/**/.gradle/**
            !platform/flutter_mxlogger/**/.cxx/**
            !platform/flutter_mxlogger/**/local.properties
            !platform/flutter_mxlogger/test/native/*.dylib
            !platform/flutter_mxlogger/test/native/build_tmp/**
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  windows-release:
    name: 3. Windows Release EXE
    needs: [windows-api, ios-api, macos-api, android-api, flutter-apple-api, flutter-android-api, flutter-windows-api]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and check Release Demo
        shell: pwsh
        run: |
          & './scripts/verify_windows_demo.ps1' -Configuration Release
          python scripts/check_local_core.py --cmake-cache build/windows-native-demo/Release/CMakeCache.txt --output build/windows-native-demo/Release/local-core.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Release EXE directly
        uses: actions/upload-artifact@v7
        with:
          path: build/windows-native-demo/Release/bin/Release/MXLoggerDemo.exe
          archive: false
          retention-days: 7
          if-no-files-found: error

  macos-release:
    name: 3. macOS Release DMG
    needs: [windows-api, ios-api, macos-api, android-api, flutter-apple-api, flutter-android-api, flutter-windows-api]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build universal Release Demo and DMG
        run: bash scripts/build_macos_demo_dmg.sh
      - name: Upload Release DMG directly
        uses: actions/upload-artifact@v7
        with:
          path: build/macos-native-demo/MXLoggerDemo-macOS-Release.dmg
          archive: false
          retention-days: 7
          if-no-files-found: error

  android-release:
    name: 3. Android Release APK
    needs: [windows-api, ios-api, macos-api, android-api, flutter-apple-api, flutter-android-api, flutter-windows-api]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;27.0.12077973 cmake;3.22.1 platforms;android-31 platforms;android-33 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Build and verify installable Release Demo APK
        run: bash scripts/verify_android_demo.sh package
      - name: Upload Release APK directly
        uses: actions/upload-artifact@v7
        with:
          path: build/android-demo/MXLoggerDemo-android-Release.apk
          archive: false
          retention-days: 7
          if-no-files-found: error
