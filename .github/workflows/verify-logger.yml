name: verify-logger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows Core + Demo (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Configure Core and tests (MSVC x64)
        run: |
          New-Item -ItemType Directory -Force build/windows-core | Out-Null
          cmake -S Core -B build/windows-core -A x64 -DMXLOGGER_BUILD_TESTS=ON 2>&1 | Tee-Object build/windows-core/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: |
          cmake --build build/windows-core --config ${{ matrix.configuration }} --parallel 2>&1 | Tee-Object build/windows-core/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        run: |
          ctest --test-dir build/windows-core -C ${{ matrix.configuration }} --output-on-failure --no-tests=error --output-junit test-results.xml 2>&1 | Tee-Object build/windows-core/ctest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows demo and window smoke
        run: |
          & './scripts/verify_windows_demo.ps1' -Configuration ${{ matrix.configuration }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-demo-${{ matrix.configuration }}-logs
          path: |
            build/windows-native-demo/${{ matrix.configuration }}/*.log
            build/windows-native-demo/${{ matrix.configuration }}/self-test/ui-report.txt
            build/windows-native-demo/${{ matrix.configuration }}/self-test/*.png
            build/windows-native-demo/${{ matrix.configuration }}/self-test/model/report.*
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-core-${{ matrix.configuration }}-logs
          path: |
            build/windows-core/*.log
            build/windows-core/test-results.xml
            build/windows-core/Testing/Temporary/
          retention-days: 7
          if-no-files-found: warn

  apple:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - name: Core, native Apple, Flutter CocoaPods and SwiftPM
        run: python3 scripts/verify_macos_support.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apple-verification-logs
          path: |
            build/macos-validation/run-*/logs/
            build/macos-native-demo/*.log
            build/macos-native-demo/previews/
          retention-days: 7
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;27.0.12077973 cmake;3.22.1 platforms;android-31 platforms;android-33 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Android library and Demo JVM unit tests
        run: bash scripts/verify_android_demo.sh test
      - name: Android Core and bridges, four ABIs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          bash scripts/verify_android_native.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-verification-logs
          path: |
            build/android-validation/*.log
            build/android-demo/*.log
            platform/Android/MXLogger/*/build/test-results/testDefaultCppReleaseUnitTest/
            platform/Android/MXLogger/*/build/reports/tests/testDefaultCppReleaseUnitTest/
          retention-days: 7
          if-no-files-found: warn

  # Release deliverables are produced only after ALL verification jobs pass,
  # including both configurations of the Windows matrix.
  windows-sdk:
    name: Windows native SDK (NuGet + vcpkg)
    needs: [windows, apple, android]
    # Build the distributable with VS 2022's toolset, rather than requiring the
    # newer compiler that windows-latest may carry.
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.x'
      - name: Build, test, pack and restore native NuGet SDK
        run: "& './scripts/build_windows_nuget.ps1'"
      - name: Verify vcpkg consumers (MD and MT, Debug and Release)
        run: "& './scripts/verify_windows_vcpkg.ps1'"
      - name: Upload native NuGet package directly
        uses: actions/upload-artifact@v7
        with:
          path: build/windows-sdk/packages/MXLogger.Native.*.nupkg
          archive: false
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-sdk-verification-logs
          path: build/windows-sdk/logs/*.log
          retention-days: 7
          if-no-files-found: warn

  windows-release:
    name: Windows Release Demo EXE
    needs: [windows, apple, android]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and check Release Demo
        shell: pwsh
        run: "& './scripts/verify_windows_demo.ps1' -Configuration Release"
      - name: Upload Release EXE directly
        uses: actions/upload-artifact@v7
        with:
          path: build/windows-native-demo/Release/bin/Release/MXLoggerDemo.exe
          archive: false
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-release-demo-build-logs
          path: |
            build/windows-native-demo/Release/*.log
            build/windows-native-demo/Release/self-test/
          retention-days: 7
          if-no-files-found: warn

  macos-release:
    name: macOS Release Demo DMG
    needs: [windows, apple, android]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build universal Release Demo and DMG
        run: bash scripts/build_macos_demo_dmg.sh
      - name: Upload Release DMG directly
        uses: actions/upload-artifact@v7
        with:
          path: build/macos-native-demo/MXLoggerDemo-macOS-Release.dmg
          archive: false
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-release-demo-build-logs
          path: build/macos-native-demo/dmg-*.log
          retention-days: 7
          if-no-files-found: warn

  android-release:
    name: Android Release Demo APK
    needs: [windows, apple, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;27.0.12077973 cmake;3.22.1 platforms;android-31 platforms;android-33 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Build and verify installable Release Demo APK
        run: bash scripts/verify_android_demo.sh package
      - name: Upload Release APK directly
        uses: actions/upload-artifact@v7
        with:
          path: build/android-demo/MXLoggerDemo-android-Release.apk
          archive: false
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-release-demo-build-logs
          path: build/android-demo/*.log
          retention-days: 7
          if-no-files-found: warn
