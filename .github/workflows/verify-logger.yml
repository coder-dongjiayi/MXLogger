name: verify-logger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows Core + Demo (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Configure Core and tests (MSVC x64)
        run: |
          New-Item -ItemType Directory -Force build/windows-core | Out-Null
          cmake -S Core -B build/windows-core -A x64 -DMXLOGGER_BUILD_TESTS=ON 2>&1 | Tee-Object build/windows-core/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: |
          cmake --build build/windows-core --config ${{ matrix.configuration }} --parallel 2>&1 | Tee-Object build/windows-core/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        run: |
          ctest --test-dir build/windows-core -C ${{ matrix.configuration }} --output-on-failure --no-tests=error --output-junit test-results.xml 2>&1 | Tee-Object build/windows-core/ctest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows demo, window smoke and package
        run: |
          & './scripts/verify_windows_demo.ps1' -Configuration ${{ matrix.configuration }} -Benchmark -ProfileWrites:('${{ matrix.configuration }}' -eq 'Release')
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-demo-${{ matrix.configuration }}-logs
          path: |
            build/windows-native-demo/${{ matrix.configuration }}/*.log
            build/windows-native-demo/${{ matrix.configuration }}/self-test/ui-report.txt
            build/windows-native-demo/${{ matrix.configuration }}/self-test/*.png
            build/windows-native-demo/${{ matrix.configuration }}/self-test/model/report.*
            build/windows-native-demo/${{ matrix.configuration }}/benchmark/*/benchmark.*
            build/windows-native-demo/${{ matrix.configuration }}/benchmark/comparison.json
            build/windows-native-demo/${{ matrix.configuration }}/profile/run-*/summary.*
            build/windows-native-demo/${{ matrix.configuration }}/profile/run-*/*/profile.json
            build/windows-native-demo/${{ matrix.configuration }}/profile/run-*/*/benchmark.json
            build/windows-native-demo/${{ matrix.configuration }}/profile/run-*/api/microbench.json
            build/windows-native-demo/${{ matrix.configuration }}/profile/run-*/*/process.log
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: windows-demo-${{ matrix.configuration }}
          path: build/windows-native-demo/${{ matrix.configuration }}/MXLoggerDemo-windows-x64-${{ matrix.configuration }}.zip
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-core-${{ matrix.configuration }}-logs
          path: |
            build/windows-core/*.log
            build/windows-core/test-results.xml
            build/windows-core/Testing/Temporary/
          retention-days: 7
          if-no-files-found: warn

  apple:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - name: Core, native Apple, Flutter CocoaPods and SwiftPM
        run: python3 scripts/verify_macos_support.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apple-verification-logs
          path: |
            build/macos-validation/run-*/logs/
            build/macos-native-demo/*.log
            build/macos-native-demo/previews/
          retention-days: 7
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;27.0.12077973'
          log-accepted-android-sdk-licenses: 'false'
      - name: Android Core and bridges, four ABIs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          bash scripts/verify_android_native.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-verification-logs
          path: build/android-validation/*.log
          retention-days: 7
          if-no-files-found: warn
