name: mxlogger_analyzer_lib
description: MXLogger 2.0 log analyzer. Import, decrypt, parse and search .mx binary log files; embeddable in-app debugger.
version: 2.0.0
homepage: https://github.com/coder-dongjiayi/MXLogger
repository: https://github.com/coder-dongjiayi/MXLogger

environment:
  sdk: ^3.11.1
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理：自带的 stream 轻量方案（lib/src/global/state），无第三方依赖

  # 日志数据库
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.28


  # 应用目录（数据库存放路径）
  path_provider: any

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
