name: mxlogger_analyzer_lib
description: MXLogger 2.0 log analyzer. Import, decrypt, parse and search .mx binary log files; embeddable in-app debugger.
version: 2.0.0
homepage: https://github.com/coder-dongjiayi/MXLogger
repository: https://github.com/coder-dongjiayi/MXLogger

environment:
  sdk: ^3.11.1
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理：自带的 stream 轻量方案（lib/src/global/state），无第三方依赖

  # 日志数据库
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.28

  # 文件导入（选文件/拖入）与设置持久化不直接依赖插件：
  # 由宿主经 MXHost/MXPrefs 注入实现（桌面壳注入 file_picker/desktop_drop/
  # shared_preferences，嵌入模式全部走默认值），移动端集成零额外 KV/文件插件

  # 系统分享（不可用时降级为剪贴板）
  share_plus: any

  # 应用目录（数据库存放路径）
  path_provider: any

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
