name: mxlogger_analyzer_lib
description: MXLogger 2.0 log analyzer. Import, decrypt, parse and search .mx binary log files; embeddable in-app debugger.
version: 2.0.0
homepage: https://github.com/coder-dongjiayi/MXLogger
repository: https://github.com/coder-dongjiayi/MXLogger

environment:
  sdk: ^3.11.1
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理：自带的 stream 轻量方案（lib/src/global/state），无第三方依赖

  # 日志数据库
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.28


  # 应用目录（数据库存放路径）
  path_provider: ^2.1.6

  # 上限跟着 flutter_localizations 走：Flutter 3.24 带 0.19，3.27+ 带 0.20
  intl: ">=0.19.0 <0.21.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

# pub.dev 上展示的界面截图（由桌面壳的 integration_test/generate_screenshots_test.dart 生成）
screenshots:
  - description: "桌面数据页：等级分布、搜索过滤与 JSON 语法树"
    path: screenshots/desktop_dark.png
  - description: "首次使用的三步导入向导"
    path: screenshots/desktop_wizard.png
  - description: "单条日志的全屏详情弹窗"
    path: screenshots/desktop_detail.png
  - description: "嵌入宿主 app：悬浮球打开的底部弹窗"
    path: screenshots/mobile_embed.png
