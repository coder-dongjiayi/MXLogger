name: mxlogger_analyzer
description: "MXLogger 日志分析工具（桌面壳）：核心功能在 mxlogger_analyzer_lib，可嵌入任意 Flutter app。"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # 分析器内核（UI/解析/数据库全部在包内，可单独发布供 app 嵌入）
  mxlogger_analyzer_lib:
    path: mxlogger_analyzer_lib

  # 桌面壳注入内核的宿主能力（见 lib/src/host/desktop_host.dart）：
  # 设置落盘 / 选文件 / 拖入文件 / 系统分享。内核本身不依赖这些插件
  shared_preferences: ^2.3.3
  file_picker: ^8.3.7
  desktop_drop: ^0.4.4
  share_plus: ^11.0.0

  # 仅 lib/main_package.dart（真机嵌入调试入口）使用：写入真实 .mx 日志 + 设备信息文件头
  flutter_mxlogger:
    path: ../../MXLogger/flutter_mxlogger
  device_info_plus: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 截图工具（integration_test/generate_screenshots_test.dart）：跑在真实 macOS
  # 应用里，才能拿到系统字体渲染的界面图
  integration_test:
    sdk: flutter
  # 同一工具用它把截图写到应用支持目录（沙盒禁止直接写仓库目录时的退路）
  path_provider: ^2.1.5
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
